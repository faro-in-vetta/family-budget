<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Сімейний бюджет</title>
<meta http-equiv="refresh" content="0; url=./app/">
<link rel="canonical" href="https://budget.faroinvetta.com/app/">
<style>
  :root{
    --paper:#F4F3EE; --surface:#FFFFFF; --ink:#16191E; --muted:#6E7480; --rule:#E2DFD6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#131519; --surface:#191C21; --ink:#ECEAE4; --muted:#8C939E; --rule:#2B3038; }
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:var(--paper);color:var(--ink);
    font-family:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;
  }
  .box{
    max-width:420px;text-align:center;background:var(--surface);
    border:1px solid var(--rule);border-radius:12px;padding:28px 26px;
  }
  h1{font-family:Georgia,"Times New Roman",serif;font-size:24px;margin:0 0 8px}
  p{color:var(--muted);font-size:14px;margin:0 0 18px}
  a.btn{
    display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;
    font-weight:700;font-size:15px;border-radius:8px;padding:11px 22px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Сімейний бюджет</h1>
    <p>Спільний сімейний бюджет на двох — надходження, плани, подушка, завдання.<br>
       Мова перемикається в самому застосунку.</p>
    <a class="btn" href="./app/">Відкрити застосунок →</a>
  </div>
</body>
</html>
